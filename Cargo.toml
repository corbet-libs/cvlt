[package]
name = "cvlt"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Vault facade: the member side's trust core for identity, keys, credentials, proofs and storage"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cvlt"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE.md", "docs/**"]

[lib]
crate-type = ["rlib"]
# All behavior vectors are integration tests; there is no separate unit harness.
test = false

[dependencies]
ckmg = { git = "https://github.com/corbet-foss/ckmg", branch = "main" }
cwst = { git = "https://github.com/corbet-foss/cwst", branch = "main" }
futures = "0.3"
blake3 = "1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
futures-executor = "0.3"
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { path = ".github/coverage-runtime" }
