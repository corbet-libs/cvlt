name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ci
  cancel-in-progress: false
  queue: max
env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_JOBS: "2"
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Resolve one dependency snapshot
        run: |
          cargo update
          python3 .github/scripts/check-lock.py
          python3 .github/scripts/test-lock.py
          node --test .github/scripts/test-auto-merge.mjs
          python3 .github/scripts/test-coverage.py
          rustc --version --verbose
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-lock
          path: Cargo.lock
      - name: Format
        id: format
        continue-on-error: true
        run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Export formatting for review
        if: always() && steps.format.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff > formatting.patch
      - uses: actions/upload-artifact@v7
        if: always() && steps.format.outcome == 'failure'
        with:
          name: formatting
          path: formatting.patch
      - name: Enforce formatting
        if: always() && steps.format.outcome == 'failure'
        run: exit 1
  wasm:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dependency-lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Execute browser vectors
        run: wasm-pack test --headless --chrome -- --locked
  coverage:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dependency-lock
      # Branch instrumentation remains a nightly Rust feature; product builds use stable.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Measure reachable native lines and branches
        run: cargo llvm-cov --locked --branch --json --output-path coverage.json --ignore-filename-regex '/tests/'
      - name: Export line-level coverage evidence
        run: cargo llvm-cov report --lcov --output-path coverage.lcov --ignore-filename-regex '/tests/'
      - name: Export annotated source locations from the same execution
        run: cargo llvm-cov report --text --output-path coverage.txt --ignore-filename-regex '/tests/'
      - name: Enforce complete measured coverage
        run: python3 .github/scripts/check-coverage.py coverage.lcov coverage.json coverage.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage.json
            coverage.lcov
            coverage.txt

  wasm-coverage:
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: python3 .github/scripts/browser-coverage-runner.py
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -Zno-profiler-runtime -Clink-args=--no-gc-sections --cfg=owned_browser_coverage
      WASM_BINDGEN_TEST_ONLY_WEB: "1"
      WASM_BINDGEN_SPLIT_LINKED_MODULES: "1"
      CHROMEDRIVER: /usr/bin/chromedriver
      CC_wasm32_unknown_unknown: clang
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dependency-lock
      # Experimental upstream coverage runs on current nightly; product builds remain stable.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-coverage
      - id: binding-version
        run: |
          python3 - <<'PYCODE'
          import os, tomllib
          packages = tomllib.load(open('Cargo.lock', 'rb'))['package']
          version = next(p['version'] for p in packages if p['name'] == 'wasm-bindgen')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + version + '\n')
          PYCODE
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,wasm-bindgen-cli@${{ steps.binding-version.outputs.version }}
      - name: Report instrumentation versions
        run: |
          rustc --version --verbose
          cargo llvm-cov --version
          clang --version
      - name: Install maintained browser driver
        run: python3 -m pip install -r .github/requirements.txt
      - name: Measure actual browser Rust lines and branches
        run: cargo llvm-cov test --locked --branch --coverage-target-only --target wasm32-unknown-unknown --json --output-path wasm-coverage.json --ignore-filename-regex '/tests/'
      - name: Export browser source counters from the same execution
        run: cargo llvm-cov report --target wasm32-unknown-unknown --lcov --output-path wasm-coverage.lcov --ignore-filename-regex '/tests/'
      - name: Export annotated browser source locations from the same execution
        run: cargo llvm-cov report --target wasm32-unknown-unknown --text --output-path wasm-coverage.txt --ignore-filename-regex '/tests/'
      - name: Enforce actual browser Rust coverage
        run: python3 .github/scripts/check-coverage.py wasm-coverage.lcov wasm-coverage.json wasm-coverage.txt wasm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wasm-coverage
          path: |
            wasm-coverage.lcov
            wasm-coverage.json
            wasm-coverage.txt
