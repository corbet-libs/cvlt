name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_JOBS: "2"
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Resolve one dependency snapshot
        run: |
          cargo update
          python3 .github/scripts/check-lock.py
          rustc --version --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: Cargo.lock
      - name: Format
        id: format
        continue-on-error: true
        run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Export formatting for review
        if: always() && steps.format.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff > formatting.patch
      - uses: actions/upload-artifact@v4
        if: always() && steps.format.outcome == 'failure'
        with:
          name: formatting
          path: formatting.patch
      - name: Enforce formatting
        if: always() && steps.format.outcome == 'failure'
        run: exit 1
  wasm:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dependency-lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Execute browser vectors
        run: wasm-pack test --headless --chrome -- --locked
  coverage:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dependency-lock
      # Branch instrumentation remains a nightly Rust feature; product builds use stable.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Measure reachable native lines and branches
        run: cargo llvm-cov --locked --branch --json --output-path coverage.json --ignore-filename-regex '/tests/'
      - name: Enforce complete measured coverage
        run: python3 .github/scripts/check-coverage.py coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.json
